services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
    ports:
      - "5432:5432"
    volumes:
      - paradedb-data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.22
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    entrypoint: ["/app/start.sh"]
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-changeme-master}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./ops/litellm/config.yaml:/app/config.yaml:ro
      - ./ops/litellm/render_config.py:/app/render_config.py:ro
      - ./ops/litellm/start.sh:/app/start.sh:ro
    depends_on:
      - paradedb

  openai-proxy:
    build:
      context: .
      dockerfile: ops/openai-proxy/Dockerfile
    env_file:
      - .env
    environment:
      OPENAI_PROXY_TARGET_URL: http://litellm:4000
      OPENAI_PROXY_TIMEOUT: ${LITELLM_TIMEOUT_SECONDS:-60}
      OPENAI_PROXY_DEFAULT_KEY: ${LITELLM_VIRTUAL_KEY:-}
    depends_on:
      - litellm
    ports:
      - "5001:5000"

  qwen-openai-proxy:
    build:
      context: .
      dockerfile: ops/openai-proxy/Dockerfile
    env_file:
      - .env
    environment:
      OPENAI_PROXY_TARGET_URL: http://qwen3:8080
      OPENAI_PROXY_TIMEOUT: ${QWEN_PROXY_TIMEOUT_SECONDS:-300}
    depends_on:
      - qwen3
    expose:
      - "5000"

  qwen3-coder-openai-proxy:
    build:
      context: .
      dockerfile: ops/openai-proxy/Dockerfile
    env_file:
      - .env
    environment:
      OPENAI_PROXY_TARGET_URL: http://qwen3-coder:8080
      OPENAI_PROXY_TIMEOUT: ${QWEN_PROXY_TIMEOUT_SECONDS:-300}
    depends_on:
      - qwen3-coder
    expose:
      - "5000"

  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      HF_HUB_DISABLE_HF_TRANSFER: "1"
      USE_OLLAMA: "false"
      USE_OLLAMA_DOCKER: "false"
      USE_RERANKING_MODEL_DOCKER: ""
      OFFLINE_MODE: "true"
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
      RAG_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
    ports:
      - "3000:8080"
    depends_on:
      - paradedb
      - openai-proxy
      - qwen3
      - qwen-openai-proxy
      - qwen3-coder
      - qwen3-coder-openai-proxy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_ORIGINS: "*"
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-10.3.0}
      ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES:-0}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./ops/ollama/modelfiles:/modelfiles:ro
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      ENABLE_QWEN3_235B: "1"
    volumes:
      - ollama-data:/root/.ollama
      - ./ops/ollama/modelfiles:/modelfiles:ro
      - ./ops/ollama/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  qwen3:
    image: ghcr.io/kth8/llama-server-vulkan:latest
    container_name: qwen3-vulkan
    restart: unless-stopped

    # expose API on localhost:8001
    ports:
      - "8001:8080"

    # pass AMD GPU devices through
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

    # named volume for model cache
    volumes:
      - qwen-cache:/root/.cache

    environment:
      # auto-download Qwen3-14B 4-bit GGUF the first time
      LLAMA_ARG_HF_REPO: "Qwen/Qwen3-14B-GGUF:Q4_K_M"
      LLAMA_ARG_JINJA: "1"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  qwen3-coder:
    image: ghcr.io/kth8/llama-server-vulkan:latest
    container_name: qwen3-coder-vulkan
    restart: unless-stopped

    ports:
      - "8002:8080"

    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

    volumes:
      - qwen-coder-cache:/root/.cache
      - ./models/qwen3-coder:/models/qwen3-coder:ro

    environment:
      LLAMA_ARG_MODEL: "/models/qwen3-coder/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf"
      LLAMA_ARG_ALIAS: "qwen3-coder-30b-a3b-q4km"
      LLAMA_ARG_N_GPU_LAYERS: "0"
      LLAMA_ARG_JINJA: "1"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  qwen3-embed:
    image: ghcr.io/kth8/llama-server-vulkan:latest
    container_name: qwen3-embed-vulkan
    restart: unless-stopped

    ports:
      - "8003:8080"

    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

    volumes:
      - qwen-embed-cache:/root/.cache
      - ./models/nomic-embed-code:/models/nomic-embed-code:ro

    environment:
      LLAMA_ARG_MODEL: "/models/nomic-embed-code/nomic-embed-code-q8.gguf"
      LLAMA_ARG_ALIAS: "nomic-embed-code"
      LLAMA_ARG_EMBEDDINGS: "1"
      LLAMA_ARG_JINJA: "0"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s




  api:
    build:
      context: .
      dockerfile: ops/openai-proxy/Dockerfile
    entrypoint: ["/app/ops/scripts/bootstrap.sh"]
    command: ["uvicorn", "src.my_agentic_chatbot.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"
      PREFECT_LOCAL_STORAGE_PATH: /tmp/prefect-results
      LITELLM_BASE_URL: http://litellm:4000
      DATABASE_URL: postgresql+psycopg://agent:agentpass@paradedb:5432/agentdb
      PYTHONPATH: /app/src:/app:/workspace/freshbot:/workspace/freshbot/src
      NEO4J_URL: bolt://neo4j:7687
    volumes:
      - .:/app
      - ../freshbot:/workspace/freshbot
      - prefect-results-data:/tmp/prefect-results
    ports:
      - "8800:8000"
    depends_on:
      - paradedb
      - litellm
      - prefect
      - docling

  prefect-worker:
    build:
      context: .
      dockerfile: ops/openai-proxy/Dockerfile
    entrypoint: ["/app/ops/scripts/bootstrap.sh"]
    command: [
      "prefect",
      "worker",
      "start",
      "--pool",
      "freshbot-process",
      "--work-queue",
      "freshbot-default"
    ]
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"
      PREFECT_LOCAL_STORAGE_PATH: /tmp/prefect-results
      LITELLM_BASE_URL: http://litellm:4000
      DATABASE_URL: postgresql+psycopg://agent:agentpass@paradedb:5432/agentdb
      PYTHONPATH: /app/src:/app:/workspace/freshbot:/workspace/freshbot/src
      NEO4J_URL: bolt://neo4j:7687
    volumes:
      - .:/app
      - ../freshbot:/workspace/freshbot
      - prefect-results-data:/tmp/prefect-results
    depends_on:
      - api
      - prefect
      - paradedb

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "8000:5001"
    volumes:
      - docling-cache:/opt/app-root/src/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8085/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-changeme-searxng}
      REDIS_URL: redis://searxng-redis:6379/0
      LIMITER_REDIS_URL: redis://searxng-redis:6379/1
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      - searxng-redis
    volumes:
      - searxng-config:/etc/searxng
      - searxng-cache:/var/cache/searxng

  searxng-redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no --loglevel warning


  prefect:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefectpass@paradedb:5432/agentdb
      PREFECT_API_DATABASE_MIGRATION_TABLE: prefect_alembic_version
      ALEMBIC_VERSION_TABLE: prefect_alembic_version
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect

  postgres-mcp:
    profiles: ["mcp-legacy"]
    image: python:3.12-slim
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:agentpass@paradedb:5432/agentdb
      POSTGRES_MCP_TOKEN: ${POSTGRES_MCP_TOKEN:-abc123xyz789}
    command: >
      sh -c "pip install --no-cache-dir postgres-mcp && postgres-mcp $${DATABASE_URL} --transport sse --sse-host 0.0.0.0 --sse-port 4050"
    depends_on:
      - paradedb
    ports:
      - "4050:4050"

  mcp-relay:
    profiles: ["mcp-legacy"]
    build: ./ops/mcp-relay
    depends_on:
      - postgres-mcp
    environment:
      RELAY_BEARER_TOKEN: ${POSTGRES_MCP_TOKEN:-abc123xyz789}
      UPSTREAM_SSE_URL: http://postgres-mcp:4050/sse
      UPSTREAM_HEALTH_URL: http://postgres-mcp:4050/health

  legal-mcp:
    profiles: ["mcp-legacy"]
    build:
      context: ./mcp/legal-knowledge-base
    env_file:
      - .env
    environment:
      PGHOST: paradedb
      PGPORT: "5432"
      PGDATABASE: agentdb
      PGUSER: agent
      PGPASSWORD: agentpass
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-changeme-master}
      MCP_PUBLIC_ENDPOINT: ${MCP_PUBLIC_ENDPOINT:-https://legal-mcp.dankersons.com/mcp/}
    depends_on:
      - paradedb
      - litellm
    ports:
      - "8100:8000"
    volumes:
      - ./mcp/legal-knowledge-base/data:/app/data
      - ./mcp/legal-knowledge-base/db:/app/db

  codex-mcp:
    build:
      context: ..
      dockerfile: mcp/codex-mcp/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:agentpass@paradedb:5432/agentdb
      FRESHBOT_DATABASE_URL: postgresql://agent:agentpass@paradedb:5432/agentdb
      PYTHONPATH: ${PYTHONPATH:-/workspace/mcp/codex-mcp/src:/workspace/freshbot/src:/workspace/intellibot}
      FRESHBOT_API_TIMEOUT: "300"
      CODEX_MCP_PUBLIC_ENDPOINT: ${CODEX_MCP_PUBLIC_ENDPOINT:-http://localhost:8105/mcp/}
      CODEX_MCP_SCOPES: kb,kb_dev,kb_all
      NEO4J_URL: bolt://neo4j:7687
    depends_on:
      - paradedb
    ports:
      - "8105:8105"
    volumes:
      - ..:/workspace
      - ..:/app

  mcp-gateway-legal:
    profiles: ["mcp-legacy"]
    image: nginx:1.27-alpine
    depends_on:
      - legal-mcp
    ports:
      - "8200:8080"
    volumes:
      - ./ops/mcp/legal-gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  neo4j-cypher-mcp:
    profiles: ["mcp-legacy"]
    image: mcp/neo4j-cypher:latest
    restart: unless-stopped
    environment:
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      NEO4J_TRANSPORT: http
      NEO4J_MCP_SERVER_HOST: 0.0.0.0
      NEO4J_MCP_SERVER_PORT: 8080
      NEO4J_MCP_SERVER_PATH: /mcp/
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: localhost,127.0.0.1,mcp-gateway-neo4j-cypher,neo4j-cypher-mcp,neo4j-cypher-mcp.dankersons.com
    depends_on:
      - neo4j

  neo4j-memory-mcp:
    profiles: ["mcp-legacy"]
    image: mcp/neo4j-memory:latest
    restart: unless-stopped
    environment:
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      NEO4J_TRANSPORT: http
      NEO4J_MCP_SERVER_HOST: 0.0.0.0
      NEO4J_MCP_SERVER_PORT: 8080
      NEO4J_MCP_SERVER_PATH: /mcp/
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: localhost,127.0.0.1,mcp-gateway-neo4j-memory,neo4j-memory-mcp,neo4j-memory-mcp.dankersons.com
    depends_on:
      - neo4j

  neo4j-modeling-mcp:
    profiles: ["mcp-legacy"]
    image: mcp/neo4j-data-modeling:latest
    restart: unless-stopped
    environment:
      NEO4J_TRANSPORT: http
      NEO4J_MCP_SERVER_HOST: 0.0.0.0
      NEO4J_MCP_SERVER_PORT: 8080
      NEO4J_MCP_SERVER_PATH: /mcp/
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: localhost,127.0.0.1,mcp-gateway-neo4j-modeling,neo4j-modeling-mcp,neo4j-modeling-mcp.dankersons.com

  mcp-gateway-neo4j-cypher:
    profiles: ["mcp-legacy"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - neo4j-cypher-mcp
    volumes:
      - ./ops/mcp/neo4j-cypher/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/mcp/neo4j-cypher/manifest.json:/etc/nginx/manifests/neo4j-cypher.json:ro

  mcp-gateway-neo4j-memory:
    profiles: ["mcp-legacy"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - neo4j-memory-mcp
    volumes:
      - ./ops/mcp/neo4j-memory/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/mcp/neo4j-memory/manifest.json:/etc/nginx/manifests/neo4j-memory.json:ro

  mcp-gateway-neo4j-modeling:
    profiles: ["mcp-legacy"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - neo4j-modeling-mcp
    volumes:
      - ./ops/mcp/neo4j-modeling/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/mcp/neo4j-modeling/manifest.json:/etc/nginx/manifests/neo4j-modeling.json:ro

  sequentialthinking-mcp:
    profiles: ["mcp-legacy"]
    build:
      context: ./ops/mcp/sequentialthinking
    restart: unless-stopped

  mcp-gateway-sequentialthinking:
    profiles: ["mcp-legacy"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - sequentialthinking-mcp
    volumes:
      - ./ops/mcp/sequentialthinking/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/mcp/sequentialthinking/manifest.json:/etc/nginx/manifests/sequentialthinking.json:ro

  cloudflared:
    profiles: ["mcp-legacy"]
    build:
      context: ./ops/cloudflared
    depends_on:
      - mcp-gateway-legal
      - mcp-gateway-neo4j-cypher
      - mcp-gateway-neo4j-memory
      - mcp-gateway-neo4j-modeling
    command: ["tunnel", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./ops/cloudflared/dankersons-mcp.yml:/etc/cloudflared/config.yml:ro
  cloudflared-openwebui:
    build:
      context: ./ops/cloudflared
    depends_on:
      - openwebui
    command: ["tunnel", "run", "--token", "${CLOUDFLARE_OPENWEBUI_TUNNEL_TOKEN}"]
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_OPENWEBUI_TUNNEL_TOKEN}
    volumes:
      - ./ops/cloudflared/openwebui.yml:/etc/cloudflared/config.yml:ro

  tei-gte-large:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-0.7
    environment:
      - MODEL_ID=${TEI_GTE_LARGE_MODEL_ID:-/models/gte-large-st}
    volumes:
      - ./models:/models:ro
    ports: ["6060:80"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 20

  tei-legal:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-0.7
    environment:
      - MODEL_ID=${TEI_LEGAL_MODEL_ID:-/models/legal-bert-st}
    volumes:
      - ./models:/models:ro
    ports: ["6061:80"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 20


volumes:
  paradedb-data:
  prefect-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  docling-cache:
  searxng-config:
  searxng-cache:
  ollama-data:
  qwen-cache:
  qwen-coder-cache:
  qwen-embed-cache:
  prefect-results-data:
