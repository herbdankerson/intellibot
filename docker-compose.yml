services:
  tiger-db:
    image: postgres:16
    container_name: tiger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DB_password_123
      POSTGRES_DB: postgres
    volumes:
      - beachbot_beachdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beachbot

  paradedb:
    image: paradedb/paradedb:latest
    container_name: paradedb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DB_password_123
      POSTGRES_DB: postgres
    volumes:
      - paradedb_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - beachbot

  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - "/home/george-siha/beachbot/docling:/workspace:rw"
    networks:
      - beachbot

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "11434:11434"
    volumes:
      - "/home/george-siha/beachbot/ollama:/root/.ollama:rw"
    networks:
      - beachbot

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password_123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
    networks:
      - beachbot

  terminus:
    image: terminusdb/terminusdb-server:latest
    container_name: terminus
    restart: unless-stopped
    ports:
      - "6363:6363"
    volumes:
      - "/home/george-siha/beachbot/terminus:/app/terminusdb/storage:rw"
    networks:
      - beachbot
    environment:
      TERMINUSDB_JWT_ENABLED: "true"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: --requirepass myredissecret
    ports:
      - "6379:6379"
    networks:
      - beachbot
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myredissecret", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: always
    depends_on:
      tiger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: "postgresql://postgres:DB_password_123@tiger-db:5432/postgres?schema=langfuse"
      SALT: "bfc4f8976afd382f90a47755a1900a298822ed86dbbb5712900f932bf413d58e"
      ENCRYPTION_KEY: "2e1002baa3c88db472cbec8c4f32bbd5c2aef176e58fdee6d24a8692f972013e"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_AUTH: "myredissecret"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "clickhouse"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "langfuse-user"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "SECURE_PASSWORD"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    networks:
      - beachbot

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: always
    depends_on:
      - langfuse-worker
    ports:
      - "3002:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: "http://localhost:3002"
      NEXTAUTH_SECRET: "f326b08c449e2fef948cd73e6b09df96cf6d8bef79583f8075ad0ff28a6e8018"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:9000"
    networks:
      - beachbot

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    networks:
      - beachbot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9090:9000"
      - "9091:9001"
    volumes:
      - langfuse_minio_data:/data
    networks:
      - beachbot
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
    environment:
      - LANGFUSE_BASIC_AUTH_HEADER=${LANGFUSE_BASIC_AUTH_HEADER}
    depends_on:
      - langfuse-web
    networks:
      - beachbot

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://postgres:DB_password_123@tiger-db:5432/postgres
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    volumes:
      - open-webui:/app/backend/data
    networks:
      - beachbot
    depends_on:
      - tiger-db

  postgres-mcp:
    image: postgres-mcp:latest
    container_name: postgres-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URI=postgresql://postgres:DB_password_123@tiger-db:5432/postgres
      - PYTHONPATH=/app/.venv/lib/python3.12/site-packages
    command: ["--transport", "sse", "--sse-host", "0.0.0.0"]
    networks:
      - beachbot
    depends_on:
      - tiger-db

networks:
  beachbot:

volumes:
  neo4j-data:
  beachbot_beachdata:
  paradedb_data:
  tigergraph-data:
  langfuse_clickhouse_data:
  langfuse_minio_data:
  db-config:
  open-webui: