model_list:
  - model_name: planner
    litellm_params:
      model: gemini/gemini-2.5-pro
      temperature: 0
      max_output_tokens: 65536
  - model_name: responder
    litellm_params:
      model: gemini/gemini-2.5-pro
      temperature: 0
      max_output_tokens: 65536
  - model_name: cheap-worker
    litellm_params:
      model: gemini/gemini-2.5-pro
      temperature: 0.2
      max_output_tokens: 65536
  - model_name: emb-general
    litellm_params:
      model: gemini/text-embedding-004
  - model_name: emb-code
    litellm_params:
      model: gemini/text-embedding-004
  - model_name: emb-law
    litellm_params:
      model: gemini/text-embedding-004
  - model_name: voyage-law-2
    litellm_params:
      model: voyage-law-2
      api_base: https://api.voyageai.com/v1
      custom_llm_provider: voyage
  - model_name: voyage-2
    litellm_params:
      model: voyage-2
      api_base: https://api.voyageai.com/v1
      custom_llm_provider: voyage
router:
  default_model: planner
  callbacks:
    - gemini_failover
