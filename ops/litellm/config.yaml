x-version: "2025-01-01"
models:
  - name: planner
    model: gpt-4o-mini
    params:
      temperature: 0
      max_tokens: 2048
  - name: responder
    model: gpt-4o
    params:
      temperature: 0
      max_tokens: 1024
  - name: cheap-worker
    model: gpt-4o-mini
    params:
      temperature: 0.2
      max_tokens: 1024
  - name: emb-general
    model: text-embedding-3-large
  - name: emb-code
    model: text-embedding-3-large
  - name: emb-law
    model: text-embedding-3-large
  - name: gemini-fallback
    model: google_gemini/gemini-2.5-pro
    params:
      temperature: 0
      max_output_tokens: 2048
router:
  default: planner
  callbacks:
    - gemini_failover
