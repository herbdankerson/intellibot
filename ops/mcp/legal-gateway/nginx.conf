user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Normalize Accept header for SSE so upstream sees exactly text/event-stream
    map $http_accept $mcp_accept {
        "~*text/event-stream" "application/json, text/event-stream";
        default               $http_accept;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;
    gzip off;

    upstream legal_mcp_upstream {
        server legal-mcp:8000;
    }

    server {
        listen 8080;
        server_name legal-mcp-proxy;
        gzip off;

        # Serve manifest directly from upstream FastAPI server
        location = /.well-known/mcp.json {
            proxy_pass http://legal_mcp_upstream/.well-known/mcp.json;
            proxy_set_header Host legal-mcp;
            proxy_set_header Connection keep-alive;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-store" always;
        }

        # Redirect bare /mcp to the stream endpoint with trailing slash
        location = /mcp {
            return 307 /mcp/;
        }

        # MCP transport (streamable HTTP sessions)
        location /mcp/ {
            proxy_pass http://legal_mcp_upstream/mcp/;
            proxy_http_version 1.1;
            proxy_set_header Host legal-mcp;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_set_header Accept $mcp_accept;
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Cache-Control "no-store";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
            tcp_nodelay on;
        }

        location = /.well-known/ {
            return 307 /.well-known/mcp.json;
        }

        location / {
            return 404;
        }
    }
}
