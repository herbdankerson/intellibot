user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip off;

    upstream neo4j_memory_upstream {
        server neo4j-memory-mcp:8080;
    }

    server {
        listen 8080;
        server_name neo4j-memory-mcp;

        location = /.well-known/mcp.json {
            default_type application/json;
            alias /etc/nginx/manifests/neo4j-memory.json;
        }

        location = /.well-known/ {
            return 307 /.well-known/mcp.json;
        }

        location /mcp/ {
            proxy_pass http://neo4j_memory_upstream/mcp/;
            proxy_http_version 1.1;
            proxy_set_header Host neo4j-memory-mcp.dankersons.com;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            return 404;
        }
    }
}
