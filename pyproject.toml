[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agentic-chatbot"
version = "0.1.0"
description = "Starter implementation of a high-fidelity agentic chatbot."
authors = [{name = "Codex"}]
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.117.1",
    "uvicorn>=0.37.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "SQLAlchemy>=2.0.43",
    "prefect>=3.4.19",
    "litellm>=1.77.3",
    "psycopg2-binary>=2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B"]
