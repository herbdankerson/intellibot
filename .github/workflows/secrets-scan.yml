name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
